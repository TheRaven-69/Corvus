minimum_pre_commit_version: "4.4.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: backend-tests
        name: backend unit tests
        entry: python backend/scripts/run_unit_tests.py
        language: unsupported
        files: ^backend/
        pass_filenames: false

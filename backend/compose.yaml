services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped

    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload

    environment:
      CORVUS_APP_NAME: ${CORVUS_APP_NAME:-Corvus API}
      CORVUS_DEBUG: ${CORVUS_DEBUG:-false}
      CORVUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-corvus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-corvus}
      CORVUS_JWT_SECRET_KEY: ${CORVUS_JWT_SECRET_KEY:?CORVUS_JWT_SECRET_KEY is required}
      CORVUS_CORS_ORIGINS: '${CORVUS_CORS_ORIGINS:-["http://localhost:5173"]}'

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health',
          timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corvus}
      POSTGRES_USER: ${POSTGRES_USER:-corvus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
